<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chanra Phone Store - Tech & Accessories</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Khmer & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Kantumruy Pro', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#080808',
              surface: '#121212',
              card: '#18181a',
              border: '#27272a',
              cyan: '#00f2fe',
              neon: '#00f0ff',
              green: '#25D366',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #080808;
      color: #f4f4f5;
      font-family: 'Inter', 'Kantumruy Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .neon-badge {
      background-color: #00f2fe;
      color: #000000;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .neon-badge-green {
      background-color: #10b981;
      color: #000000;
      font-weight: 700;
    }
    .neon-badge-sim {
      background-color: #f59e0b;
      color: #000000;
      font-weight: 700;
    }
    .neon-badge-fix {
      background-color: #a855f7;
      color: #ffffff;
      font-weight: 700;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      setDoc, 
      deleteDoc,
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Firebase configuration ផ្ទាល់ខ្លួនរបស់អ្នក (chanraphone2026shop)
    const firebaseConfig = {
      apiKey: "AIzaSyBNRTq3SAZRAB_Q-COFAcFUEOWK-0ZKNh8",
      authDomain: "chanraphone2026shop.firebaseapp.com",
      databaseURL: "https://chanraphone2026shop-default-rtdb.firebaseio.com",
      projectId: "chanraphone2026shop",
      storageBucket: "chanraphone2026shop.firebasestorage.app",
      messagingSenderId: "431229921729",
      appId: "1:431229921729:web:9730a2968374c191416740",
      measurementId: "G-LR3MF2FJ58"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreTools = { collection, onSnapshot, doc, setDoc, deleteDoc, getDocs };
    
    // បាញ់ Event ប្រាប់ថារួចរាល់
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body class="bg-[#080808] text-zinc-100 min-h-screen flex flex-col pb-20 select-none">

  <!-- Header Section -->
  <header class="sticky top-0 z-40 bg-[#080808]/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#00f2fe] to-cyan-500 flex items-center justify-center font-black text-black text-lg shadow-[0_0_15px_rgba(0,242,254,0.3)]">
          C
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight text-white leading-tight">CHANRA PHONE</h1>
          <p class="text-[10px] text-zinc-400 font-normal">Tech • SIM • Service</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Admin Toggle Shield -->
        <button id="admin-key-btn" onclick="toggleAdminPrompt()" class="p-2 rounded-full hover:bg-zinc-800 text-zinc-400 hover:text-cyan-400 transition" title="ផ្ទាំង Admin">
          <i data-lucide="shield" class="w-5 h-5"></i>
        </button>

        <!-- Cart Button -->
        <button onclick="toggleCartModal(true)" class="relative p-2 rounded-full hover:bg-zinc-800 text-zinc-200 transition">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-count-badge" class="hidden absolute top-1 right-1 w-4 h-4 bg-[#00f2fe] text-black text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Bar (បង្ហាញតែពេល Login ជា Admin) -->
  <div id="admin-banner" class="hidden bg-cyan-950/60 border-b border-cyan-800/60 px-4 py-2">
    <div class="max-w-5xl mx-auto flex items-center justify-between text-xs">
      <div class="flex items-center gap-2 text-cyan-300 font-medium">
        <i data-lucide="shield-check" class="w-4 h-4 text-cyan-400"></i>
        <span>ផ្ទាំងគ្រប់គ្រងហាង (Admin Mode)</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openProductModal()" class="bg-[#00f2fe] hover:bg-cyan-400 text-black px-2.5 py-1 rounded font-bold transition flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> បន្ថែមទំនិញ
        </button>
        <button onclick="logoutAdmin()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded transition">ចាកចេញ</button>
      </div>
    </div>
  </div>

  <!-- Category Filter Tabs -->
  <nav class="sticky top-[57px] z-30 bg-[#080808]/95 backdrop-blur border-b border-zinc-900 py-2.5 px-4">
    <div class="max-w-5xl mx-auto flex items-center gap-2 overflow-x-auto hide-scrollbar text-xs font-semibold uppercase tracking-wider">
      <button onclick="setCategory('ALL')" class="cat-btn active px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-white text-black font-bold">ALL</button>
      <button onclick="setCategory('PHONES')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-white">PHONES</button>
      <button onclick="setCategory('CASES')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-white">CASES</button>
      <button onclick="setCategory('POWER')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-white">POWER</button>
      <button onclick="setCategory('AUDIO')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-white">AUDIO</button>
      <button onclick="setCategory('WATCH')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-white">WATCH</button>
      <button onclick="setCategory('SIM')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-amber-400 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> SIM CARDS
      </button>
      <button onclick="setCategory('SERVICES')" class="cat-btn px-3.5 py-1.5 rounded-full transition whitespace-nowrap bg-zinc-900 text-zinc-400 hover:text-purple-400 flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span> សេវ៉ាកម្ម
      </button>
    </div>
  </nav>

  <!-- Product Grid (៣ ជួរលើទូរស័ព្ទ / 3 Columns Grid) -->
  <main class="max-w-5xl mx-auto w-full px-2 sm:px-4 py-4 flex-1">
    <div id="loading-spinner" class="py-20 flex flex-col items-center justify-center text-zinc-500 gap-2">
      <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-[#00f2fe]"></i>
      <p class="text-xs">កំពុងទាញយកទិន្នន័យពី Cloud Firestore...</p>
    </div>
    
    <div id="product-grid" class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 sm:gap-3.5">
      <!-- Cards នឹងត្រូវទាញចេញពី Firebase មក Render ត្រង់នេះ -->
    </div>
  </main>

  <!-- Bottom Quick Cart Float Bar (ទូរស័ព្ទ) -->
  <div id="quick-cart-bar" class="fixed bottom-4 left-4 right-4 z-30 max-w-md mx-auto hidden">
    <button onclick="toggleCartModal(true)" class="w-full bg-[#00f2fe] hover:bg-cyan-400 text-black font-bold py-3 px-5 rounded-2xl flex items-center justify-between shadow-[0_10px_25px_rgba(0,242,254,0.3)] transition active:scale-[0.98]">
      <div class="flex items-center gap-2">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span id="quick-cart-items-text">0 មុខទំនិញ</span>
      </div>
      <div class="flex items-center gap-1 font-extrabold text-base">
        <span id="quick-cart-total-text">$0.00</span>
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </div>
    </button>
  </div>

  <!-- Modal: Detail មើលទំនិញ & Gallery -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#141416] border border-zinc-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto hide-scrollbar flex flex-col">
      <div class="relative bg-zinc-950 w-full aspect-square flex items-center justify-center overflow-hidden">
        <img id="detail-main-img" src="" alt="Product Detail" class="w-full h-full object-cover">
        
        <!-- Gallery Navigation Arrows -->
        <button id="detail-prev-img" onclick="changeDetailImage(-1)" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 rounded-full bg-black/60 text-white hover:bg-black/80 hidden">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <button id="detail-next-img" onclick="changeDetailImage(1)" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-full bg-black/60 text-white hover:bg-black/80 hidden">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>

        <button onclick="toggleDetailModal(false)" class="absolute top-3 right-3 p-2 rounded-full bg-black/60 text-white hover:bg-zinc-800 transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Multiple Thumbnails Strip -->
      <div id="detail-thumbnails-container" class="flex gap-2 p-3 bg-zinc-900/60 overflow-x-auto hide-scrollbar border-b border-zinc-800/60"></div>

      <div class="p-5 flex flex-col gap-4">
        <div class="flex items-start justify-between gap-3">
          <div>
            <span id="detail-cat-badge" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">PHONE</span>
            <h2 id="detail-title" class="text-lg font-bold text-white mt-1"></h2>
          </div>
          <div id="detail-price" class="text-xl font-black text-[#00f2fe]"></div>
        </div>

        <p id="detail-desc" class="text-xs text-zinc-400 leading-relaxed"></p>

        <!-- Options: Specs/Storage & Colors -->
        <div id="detail-specs-box">
          <label id="detail-spec-label" class="text-[11px] font-semibold text-zinc-300 block mb-1.5 uppercase">ជម្រើសទំហំ / ម៉ូដែល</label>
          <div id="detail-specs-list" class="flex flex-wrap gap-2 text-xs"></div>
        </div>

        <div id="detail-colors-box">
          <label class="text-[11px] font-semibold text-zinc-300 block mb-1.5 uppercase">ជម្រើសពណ៌</label>
          <div id="detail-colors-list" class="flex flex-wrap gap-2"></div>
        </div>

        <button id="add-to-cart-action-btn" onclick="addToCartFromDetail()" class="w-full mt-2 bg-[#00f2fe] hover:bg-cyan-400 text-black font-extrabold py-3.5 rounded-xl transition flex items-center justify-center gap-2 active:scale-[0.98]">
          <i data-lucide="plus-circle" class="w-5 h-5"></i> ដាក់ចូលកន្ត្រក (Add to Cart)
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Cart & Checkout -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#141416] border border-zinc-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col">
      <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-[#00f2fe]"></i>
          <h3 class="font-bold text-sm text-white">កន្ត្រកទំនិញ (Your Cart)</h3>
        </div>
        <button onclick="toggleCartModal(false)" class="p-1 rounded-full text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="cart-items-list" class="p-4 flex-1 overflow-y-auto space-y-3 min-h-[160px]">
        <!-- Cart Items -->
      </div>

      <div class="p-4 border-t border-zinc-800 bg-zinc-900/40 flex flex-col gap-3">
        <div class="flex items-center justify-between text-sm">
          <span class="text-zinc-400">តម្លៃសរុប (Total)</span>
          <span id="cart-total-price" class="text-xl font-black text-[#00f2fe]">$0.00</span>
        </div>
        <button onclick="checkoutToTelegram()" class="w-full bg-[#00f2fe] hover:bg-cyan-400 text-black font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(0,242,254,0.3)]">
          <i data-lucide="send" class="w-4 h-4"></i> បញ្ជាទិញតាម Telegram
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Admin Add / Edit Product -->
  <div id="admin-product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-[#18181b] border border-zinc-700 w-full max-w-lg rounded-2xl max-h-[92vh] overflow-y-auto p-5 flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <h3 id="admin-form-title" class="font-bold text-sm text-white">បន្ថែមទំនិញថ្មី</h3>
        <button onclick="closeProductModal()" class="text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="form-product-id">

        <div>
          <label class="block text-zinc-400 mb-1">ឈ្មោះទំនិញ ឬសេវ៉ាកម្ម *</label>
          <input type="text" id="form-name" required class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400" placeholder="ឧ. iPhone 16 Pro Max">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 mb-1">ប្រភេទ (Category) *</label>
            <select id="form-category" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
              <option value="PHONES">PHONES</option>
              <option value="CASES">CASES</option>
              <option value="POWER">POWER</option>
              <option value="AUDIO">AUDIO</option>
              <option value="WATCH">WATCH</option>
              <option value="SIM">SIM CARDS</option>
              <option value="SERVICES">SERVICES (សេវ៉ាកម្ម)</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-400 mb-1">តម្លៃ ($ USD) *</label>
            <input type="number" step="0.01" id="form-price" required class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400" placeholder="1199.00">
          </div>
        </div>

        <!-- Phone Photo Upload with Multi-select -->
        <div class="p-3 bg-zinc-900/80 rounded-xl border border-zinc-800 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-zinc-300 font-semibold flex items-center gap-1.5">
              <i data-lucide="image" class="w-4 h-4 text-cyan-400"></i> រូបភាពទំនិញ (ជ្រើសបានច្រើនសន្លឹក)
            </span>
            <label class="cursor-pointer bg-zinc-800 hover:bg-zinc-700 text-cyan-300 px-2.5 py-1 rounded text-[11px] font-medium flex items-center gap-1 transition">
              <i data-lucide="camera" class="w-3.5 h-3.5"></i> រើសរូបពីទូរស័ព្ទ
              <input type="file" id="phone-img-input" multiple accept="image/*" class="hidden" onchange="handleMultipleImageUpload(event)">
            </label>
          </div>

          <!-- Thumbnails Preview Container -->
          <div id="admin-thumbnails-preview" class="flex flex-wrap gap-2 pt-1 min-h-[40px]">
            <span class="text-[10px] text-zinc-500 italic">មិនទាន់មានរូបភាព...</span>
          </div>

          <div>
            <label class="block text-[10px] text-zinc-400 mb-1">ឬបិទភ្ជាប់ Image URLs (ខណ្ឌដោយសញ្ញាក្បៀស `,`):</label>
            <input type="text" id="form-img-urls" class="w-full bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1.5 text-zinc-300 text-[11px]" placeholder="https://..., https://...">
          </div>
        </div>

        <div>
          <label class="block text-zinc-400 mb-1">ជម្រើស Storage / ម៉ូដែល / លេខស៊ីម (ខណ្ឌដោយក្បៀស `,`)</label>
          <input type="text" id="form-specs" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white" placeholder="256GB, 512GB, 1TB">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1">ជម្រើសពណ៌ (Hex Codes ខណ្ឌដោយក្បៀស `,`)</label>
          <input type="text" id="form-colors" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white" placeholder="#1a1a1a, #e2e8f0, #d4af37">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1">ការពិពណ៌នា (Description)</label>
          <textarea id="form-desc" rows="2" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white" placeholder="លក្ខណៈពិសេសរបស់ទំនិញ..."></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
          <button type="button" onclick="closeProductModal()" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium">បោះបង់</button>
          <button type="submit" id="form-submit-btn" class="px-5 py-2 rounded-lg bg-[#00f2fe] hover:bg-cyan-400 text-black font-bold">រក្សាទុក</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Global State
    let products = [];
    let currentCategory = 'ALL';
    let isAdmin = false;
    let cart = [];
    let activeDetailProduct = null;
    let activeImageIndex = 0;
    let temporaryUploadedImages = [];

    // Telegram Info (អ្នកអាចប្តូរ username របស់អ្នកត្រង់នេះ)
    const TELEGRAM_USERNAME = "Chanra_Shop"; 

    // Initial Demo Products (បើ Firebase នៅទទេ វានឹង Seed ទិន្នន័យនេះទៅ Firestore)
    const initialMockProducts = [
      {
        id: "prod-1",
        name: "iPhone 16 Pro Max",
        category: "PHONES",
        price: 1199,
        images: ["https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600&auto=format&fit=crop&q=80"],
        specs: ["256GB", "512GB", "1TB"],
        colors: ["#2d2c2a", "#e3e4e5", "#bfa48f"],
        desc: "បន្ទះឈីប A18 Pro, តួទីតាញ៉ូមស្រាលធន់, Camera Control ថ្មី"
      },
      {
        id: "prod-2",
        name: "Galaxy S24 Ultra",

      initFirestoreListener();

    function initFirestoreListener() {
      const { collection, onSnapshot, doc, setDoc, getDocs } = window.firestoreTools;
      const productsRef = collection(window.db, "products");

      onSnapshot(productsRef, async (snapshot) => {
        const loaded = [];
        snapshot.forEach(docSnap => {
          loaded.push({ id: docSnap.id, ...docSnap.data() });
        });

        // បើសិន Firestore នៅទទេ សូម Seed Mock Products ចូលជាលើកដំបូង
        if (loaded.length === 0) {
          for (let item of initialMockProducts) {
            await setDoc(doc(window.db, "products", item.id), item);
          }
          return;
        }

        products = loaded;
        document.getElementById('loading-spinner').classList.add('hidden');
        renderProductGrid();
      }, (error) => {
        console.error("Firestore Listen error:", error);
      });
    }

    // Admin Image Upload with Compression
    function handleMultipleImageUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            // Resize and Compress Image
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            temporaryUploadedImages.push(compressedBase64);
            renderAdminThumbnails();
          };
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleProductSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('form-product-id').value || `prod-${Date.now()}`;
      const name = document.getElementById('form-name').value;
      const category = document.getElementById('form-category').value;
      const price = parseFloat(document.getElementById('form-price').value);
      const desc = document.getElementById('form-desc').value;

      // Extract URLs from text input
      const urlsInput = document.getElementById('form-img-urls').value.trim();
      const additionalUrls = urlsInput ? urlsInput.split(',').map(u => u.trim()).filter(Boolean) : [];
      
      const allImages = [...temporaryUploadedImages, ...additionalUrls];
      const finalImages = allImages.length > 0 ? allImages : ["https://via.placeholder.com/300?text=Phone+Store"];

      const specsRaw = document.getElementById('form-specs').value.trim();
      const specs = specsRaw ? specsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

      const colorsRaw = document.getElementById('form-colors').value.trim();
      const colors = colorsRaw ? colorsRaw.split(',').map(c => c.trim()).filter(Boolean) : [];

      const payload = {
        name,
        category,
        price,
        desc,
        images: finalImages,
        specs,
        colors
      };

      try {
        const { doc, setDoc } = window.firestoreTools;
        await setDoc(doc(window.db, "products", id), payload);
        closeProductModal();
        showToast("រក្សាទុកទៅកាន់ Firestore ជោគជ័យ!");
      } catch (err) {
        console.error("Save error:", err);
        alert("មានបញ្ហាក្នុងការរក្សាទុក: " + err.message);
      }
    }

      try {

        await deleteDoc(doc(window.db, "products", id));
        showToast("បានលុបទំនិញជោគជ័យ!");

      }
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = "fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-cyan-950 border border-cyan-400 text-cyan-200 text-xs px-4 py-2 rounded-xl shadow-lg transition duration-300";
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
  </script>
</body>
</html>
